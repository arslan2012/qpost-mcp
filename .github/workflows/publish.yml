name: Publish to npm and MCP Registry

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN stored anywhere.
# npm verifies the request came from this exact repo + workflow file, and
# attaches a provenance attestation automatically. Also publishes server.json
# to the official MCP registry via its own OIDC method (no secret needed
# either) — this used to require an interactive `mcp-publisher login github`,
# so the registry silently lagged npm by two versions (stuck on 0.2.0 while
# npm moved to 0.3.0).
#
# One-time setup on npmjs.com (Package settings -> Trusted Publisher):
#   Organization or user: arslan2012
#   Repository:           qpost-mcp
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)
#
# To release: bump the version in package.json (and server.json), commit,
# then push a matching tag:
#   npm version patch -m "v%s" && git push --follow-tags
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required: lets the runner mint the OIDC token npm and the MCP
      # registry each check.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node pins an older bundled npm, so upgrade before publishing.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json and server.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          if [ "$PKG" != "$SRV" ]; then
            echo "package.json version $PKG does not match server.json version $SRV" >&2
            exit 1
          fi
          echo "publishing $PKG"

      - name: Publish to npm
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "qpost-mcp@$PKG" version >/dev/null 2>&1; then
            echo "qpost-mcp@$PKG already on npm, skipping (this run may be backfilling the MCP registry only)"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
