name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN stored anywhere.
# npm verifies the request came from this exact repo + workflow file, and
# attaches a provenance attestation automatically.
#
# One-time setup on npmjs.com (Package settings -> Trusted Publisher):
#   Organization or user: arslan2012
#   Repository:           qpost-mcp
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)
#
# To release: bump the version in package.json (and server.json), commit,
# then push a matching tag:
#   npm version patch -m "v%s" && git push --follow-tags
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required: lets the runner mint the OIDC token npm checks.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node pins an older bundled npm, so upgrade before publishing.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "publishing $PKG"

      - name: Publish
        run: npm publish --access public
